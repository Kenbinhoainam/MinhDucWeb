<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh Đức V14 · Verification</title><style>
*{box-sizing:border-box}body{margin:0;font:13px/1.6 Arial,sans-serif;background:#e9eff1;color:#183449}header{padding:12px 18px;background:#fff;border-bottom:1px solid #c9d5dc;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;min-height:40px;border:1px solid #9bb0bd;background:#fff;color:#17354a;padding:8px 12px;border-radius:5px}button{cursor:pointer}h1{font-size:14px;margin:0 15px 0 0}#status{margin-left:auto;max-width:450px}#stage{padding:20px;overflow:auto;min-height:850px}iframe{display:block;border:0;background:#fff;margin:auto;box-shadow:0 0 0 1px #c8d2d9;height:900px;max-width:none}#output{padding:20px;background:white;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}#progress{height:4px;background:#b51f37;width:0;transition:width .1s}
</style><header><h1>MINH ĐỨC V14 / QA</h1><label>Viewport <select id="width"><option>390</option><option>320</option><option>768</option><option>1440</option><option>2560</option></select></label><select id="route"><option value="index.html">Homepage</option><option value="viec-lam.html">Jobs</option><option value="tuyen-dung-noi-bo.html">Internal jobs</option><option value="dich-vu.html">Services</option><option value="chi-tiet-viec-lam.html?id=cn-dien-tu">Application</option><option value="bai-viet.html?id=chinh-sach-phuc-loi">Article</option><option value="tin-tuc.html">Knowledge hub</option><option value="lien-he.html">Business enquiry</option><option value="quan-tri.html">CMS</option></select><select id="lang"><option>vi</option><option>en</option><option>zh</option><option>ko</option></select><button id="matrix">Responsive checks</button><button id="flows">Interaction checks</button><button id="stress">Content stress checks</button><button id="metrics">Fixed viewport metrics</button><button id="jump">Jump to main feature</button><span id="status">Ready</span></header><div id="progress"></div><div id="stage"><iframe id="view" title="Device preview" style="width:390px" src="index.html?lang=vi&preview=1"></iframe></div><pre id="output"></pre><script>
const frame=document.querySelector('#view'),width=document.querySelector('#width'),route=document.querySelector('#route'),lang=document.querySelector('#lang'),out=document.querySelector('#output'),status=document.querySelector('#status');
const results={responsive:[],interactions:[],stress:[]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const url=(p,l)=>p+(p.includes('?')?'&':'?')+'lang='+l+'&preview=1';
function ready(){return new Promise(resolve=>{frame.onload=async()=>{await frame.contentDocument.fonts.ready;await sleep(100);resolve();};});}
async function load(p,l,w){const blank=ready();frame.src='about:blank';await blank;frame.style.width=w+'px';const done=ready();frame.src=url(p,l);await done;return frame.contentDocument;}
function show(){load(route.value,lang.value,Number(width.value));}
document.querySelector('#metrics').onclick=async()=>{await load(route.value,lang.value,Number(width.value));await sleep(200);const data=await performanceSnapshot(frame.contentDocument);out.textContent=JSON.stringify(data,null,2);status.textContent='Fixed viewport measurement captured';};
for(const input of [width,route,lang])input.addEventListener('change',show);
document.querySelector('#jump').onclick=()=>{const d=frame.contentDocument;const target=d.querySelector('#resultHeading,#workforce,#service-panel,#newsListing,#contactForm,.v14-article-content,#v14Preflight');target?.scrollIntoView({block:'start',behavior:'instant'});};
const visible=(e,w)=>{const s=w.getComputedStyle(e);return !!e.getClientRects().length&&s.display!=='none'&&s.visibility!=='hidden'&&!e.closest('[hidden],[aria-hidden="true"]');};
async function performanceSnapshot(doc){const win=doc.defaultView;const observed={lcpMs:null,cls:0,shifts:[]};const observers=[];try{for(const type of ['largest-contentful-paint','layout-shift']){const observer=new win.PerformanceObserver(list=>{for(const entry of list.getEntries()){if(type==='largest-contentful-paint')observed.lcpMs=Math.round(entry.startTime);else if(!entry.hadRecentInput){observed.cls+=entry.value;observed.shifts.push({value:entry.value,sources:(entry.sources||[]).map(s=>({tag:s.node?.tagName,className:s.node?.className,document:s.node?.ownerDocument?.URL,previous:s.previousRect.toJSON(),current:s.currentRect.toJSON()}))});}}});observer.observe({type,buffered:true});observers.push(observer);}}catch{}await sleep(80);observers.forEach(o=>o.disconnect());const nav=win.performance.getEntriesByType('navigation')[0];return{...observed,cls:Number(observed.cls.toFixed(4)),domContentLoadedMs:nav?Math.round(nav.domContentLoadedEventEnd):null,viewportHeight:900,environment:'Chromium preview, unthrottled; snapshot after fonts ready'};}
async function loadImages(doc){const imgs=[...doc.images];await Promise.all(imgs.map(img=>{img.loading='eager';if(img.complete)return;return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,3000);});}));}
function measure(doc,p,l,w){const win=doc.defaultView;const clipped=[...doc.querySelectorAll('h1,h2,h3,button,.btn,label')].filter(e=>visible(e,win)&&e.clientWidth&&e.scrollWidth>e.clientWidth+3&&!e.closest('.partner-marquee,.sr-only')).map(e=>e.textContent.trim().slice(0,90));const overflow=Math.max(0,doc.documentElement.scrollWidth-w);const h1=[...doc.querySelectorAll('h1')].filter(e=>visible(e,win)).length;const broken=[...doc.images].filter(i=>i.complete&&!i.naturalWidth&&i.getAttribute('src')).map(i=>i.getAttribute('src'));return{page:p,lang:l,width:w,overflow,h1,clipped,broken,fallbacks:doc.querySelectorAll('.v14-image-unavailable').length,enhanced:!!doc.querySelector('img[data-image-guard]')};}
function render(){out.textContent=JSON.stringify(results,null,2);}
document.querySelector('#matrix').onclick=async()=>{
const button=document.querySelector('#matrix');button.disabled=true;results.responsive=[];const tasks=[];const pages=['index.html','viec-lam.html','tuyen-dung-noi-bo.html','chi-tiet-viec-lam.html?id=cn-dien-tu','chi-tiet-viec-lam.html?id=ky-su-co-dien','dich-vu.html','ve-minh-duc.html','tin-tuc.html','bai-viet.html?id=chinh-sach-phuc-loi','lien-he.html'];
for(const p of pages)for(const l of ['vi','en','zh','ko'])for(const w of [320,390,768,1440])tasks.push([p,l,w]);for(const l of ['vi','en','zh','ko'])tasks.push(['index.html',l,2560]);for(const w of [320,390,768,1440])tasks.push(['quan-tri.html','vi',w]);
// Visible iframe checks all real images, including content below the fold.
for(const [p,l,w]of tasks){try{const d=await load(p,l,w);const lab=await performanceSnapshot(d);await loadImages(d);const {shifts,...summary}=lab;results.responsive.push({...measure(d,p,l,w),lab:summary});}catch(e){results.responsive.push({page:p,lang:l,width:w,error:String(e)});}status.textContent='Checked '+results.responsive.length+' / '+tasks.length;document.querySelector('#progress').style.width=(100*results.responsive.length/tasks.length)+'%';render();}
const issues=results.responsive.filter(r=>r.error||r.overflow||r.h1!==1||r.clipped?.length||r.broken?.length||r.fallbacks||!r.enhanced);status.textContent='Complete: '+tasks.length+' checks, '+issues.length+' issues';button.disabled=false;render();};
function dispatch(el,type='input'){el.dispatchEvent(new el.ownerDocument.defaultView.Event(type,{bubbles:true}));}
function assert(name,condition,detail=''){results.interactions.push({name,passed:!!condition,detail});render();if(!condition)throw Error(name+': '+detail);}
document.querySelector('#flows').onclick=async()=>{const button=document.querySelector('#flows');button.disabled=true;results.interactions=[];const previousStorage=localStorage.getItem('minhduc_premium_v5_multisite'),previousSaved=localStorage.getItem('md_saved_jobs');const previousSession=Object.fromEntries(Object.keys(sessionStorage).map(k=>[k,sessionStorage.getItem(k)]));try{
let d=await load('viec-lam.html','vi',390);d.querySelector('[name=q]').value='co khi';dispatch(d.querySelector('[name=q]'));await sleep(250);assert('Accent-insensitive search',d.querySelector('#jobCount').textContent==='1');assert('Filters survive URL',frame.contentWindow.location.search.includes('q=co+khi'));d.querySelector('[data-save-job]').click();assert('Bookmark state',d.querySelector('[data-save-job]').getAttribute('aria-pressed')==='true');d.querySelector('[data-clear-filters]').click();assert('Clear filters',d.querySelector('#jobCount').textContent==='5');d.querySelector('[data-sort=high]').click();assert('Salary sorting',d.querySelector('.v14-listing-job h3').textContent.includes('kho vận'));
d.querySelector('[data-compare-job="cn-co-khi"]').click();d.querySelector('[data-compare-job="kho-van"]').click();assert('Comparison tray',d.querySelector('#compareTray [data-open-comparison]')&&!d.querySelector('#compareTray [data-open-comparison]').disabled);d.querySelector('[data-open-comparison]').click();assert('Comparison dialog',d.querySelectorAll('.v14-compare-column').length===2);const close=d.querySelector('.modal-close');close.click();await sleep(20);assert('Dialog restores page',!d.querySelector('.modal-layer')&&!d.querySelector('#app').inert);d.querySelector('[data-clear-comparison]').click();
d=await load('viec-lam.html?q=co+khi&salary=12&sort=high','en',390);assert('Query and salary restored',d.querySelector('[name=q]').value==='co khi'&&d.querySelector('[name=salary]').value==='12'&&d.querySelector('[data-sort=high]').getAttribute('aria-pressed')==='true');assert('Language follows links',d.querySelector('.v14-listing-job h3 a').getAttribute('href').includes('lang=en'));
d=await load('dich-vu.html','vi',1440);d.querySelector('[data-service=recruitment]').click();assert('Service selector',d.querySelector('#service-panel').getAttribute('aria-labelledby')==='service-recruitment');assert('Service scope',d.querySelector('#service-panel ul').children.length===3);const contact=d.querySelector('#service-panel .link').getAttribute('href');d=await load(contact,'vi',390);assert('Context carried to enquiry',d.querySelector('[name=message]').value.includes('Tuyển dụng theo yêu cầu'));d.querySelector('#contactNext').click();assert('Enquiry second step',!d.querySelector('[data-contact-step="2"]').hidden);d.querySelector('#contactForm').dispatchEvent(new d.defaultView.Event('submit',{bubbles:true,cancelable:true}));assert('Enquiry errors at fields',d.querySelectorAll('[aria-invalid=true]').length>=2);d.querySelector('[name=name]').value='Kiểm thử giao diện';d.querySelector('[name=phone]').value='0900000000';d.querySelector('[name=consent]').checked=true;d.querySelector('#contactForm').dispatchEvent(new d.defaultView.Event('submit',{bubbles:true,cancelable:true}));await sleep(600);assert('Enquiry simulated completion',!!d.querySelector('.md-form-success'));assert('No contact details persisted',!String(localStorage.getItem('minhduc_premium_v5_multisite')).includes('0900000000')&&!JSON.stringify(sessionStorage).includes('0900000000'));
d=await load('chi-tiet-viec-lam.html?id=cn-dien-tu','vi',390);d.querySelector('#applyNext').click();assert('Application requires preferences',!d.querySelector('#applyStepError').hidden);d.querySelector('[name=shift][value="Ca ngày"]').checked=true;dispatch(d.querySelector('[name=shift]'),'change');d.querySelector('[name=shuttle][value="Có"]').checked=true;dispatch(d.querySelector('[name=shuttle]'),'change');d.querySelector('[name=area]').value='Bắc Ninh';dispatch(d.querySelector('[name=area]'),'change');d.querySelector('#applyNext').click();assert('Application second step',!d.querySelector('[data-step="2"]').hidden);d.querySelector('#applyBack').click();assert('Back preserves preferences',d.querySelector('[name=shift]:checked').value==='Ca ngày');
d=await load('tin-tuc.html','vi',390);d.querySelector('[data-news-kind=video]').click();assert('Knowledge type filter',d.querySelectorAll('.v14-news-card').length===1);d.querySelector('[data-news-kind=all]').click();d.querySelector('#newsQuery').value='xxxxx-not-found';dispatch(d.querySelector('#newsQuery'));assert('Knowledge empty state',!!d.querySelector('[data-news-reset]'));d.querySelector('[data-news-reset]').click();assert('Knowledge clear restores content',d.querySelectorAll('.v14-news-card').length===4);
d=await load('index.html','vi',1440);await loadImages(d);assert('All homepage editorial images decode',[...d.querySelectorAll('.news-card img')].every(i=>i.complete&&i.naturalWidth>0));const image=d.querySelector('.news-card img');image.src='assets/qa-nonexistent.webp';await sleep(150);assert('Image failure has retry state',!!d.querySelector('.v14-image-unavailable [data-retry-image]'));
d=await load('quan-tri.html','vi',1440);assert('CMS live structural audit',!!d.querySelector('#v14Preflight'));d.querySelector('[data-admin=jobs]').click();d.querySelector('[data-edit-job]').click();assert('CMS job preview available',!!d.querySelector('[data-preview-cms]'));d.querySelector('[data-preview-cms]').click();assert('CMS preview uses correct record',d.querySelector('#mdPreviewFrame').getAttribute('src').includes('id=cn-dien-tu'));d.querySelector('.modal-close').click();await sleep(20);const form=d.querySelector('#jobEditForm');form.elements.min.value=20;form.elements.max.value=10;form.dispatchEvent(new d.defaultView.Event('submit',{bubbles:true,cancelable:true}));assert('CMS rejects reversed salary',!form.elements.max.checkValidity());
status.textContent='Interactions complete: '+results.interactions.length+' passed';
}catch(e){status.textContent='Interaction failure: '+e.message;}finally{if(previousStorage===null)localStorage.removeItem('minhduc_premium_v5_multisite');else localStorage.setItem('minhduc_premium_v5_multisite',previousStorage);if(previousSaved===null)localStorage.removeItem('md_saved_jobs');else localStorage.setItem('md_saved_jobs',previousSaved);sessionStorage.clear();for(const[k,v]of Object.entries(previousSession))sessionStorage.setItem(k,v);button.disabled=false;render();}};
document.querySelector('#stress').onclick=async()=>{results.stress=[];for(const[p,l,w]of [['index.html','vi',320],['index.html','ko',390],['viec-lam.html','en',390],['dich-vu.html','zh',320],['lien-he.html','ko',390],['index.html','vi',1440]]){const d=await load(p,l,w);d.querySelectorAll('main h1,main h2,main h3,main .btn').forEach(e=>e.textContent=e.textContent+' '+e.textContent);const img=d.querySelector('.md-hero-img');if(img){img.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMjAiIGhlaWdodD0iOTYwIj48cmVjdCB3aWR0aD0iMzIwIiBoZWlnaHQ9Ijk2MCIgZmlsbD0id2hpdGUiLz48L3N2Zz4=';}await loadImages(d);const r=measure(d,p,l,w);results.stress.push(r);render();}status.textContent='Stress checks complete: '+results.stress.length;};
</script></html>
