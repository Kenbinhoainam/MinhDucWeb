<!doctype html><html lang="vi"><meta charset="utf-8"><title>Company demo rollback QA</title><style>body{font:14px/1.6 system-ui;margin:20px}button{padding:12px}iframe{display:block;border:1px solid #ddd;height:900px}pre{white-space:pre-wrap}#stage{overflow:auto}</style><h1>V17.1 · Company demo</h1><button id="matrix">Check logo matrix</button><button id="migration">Check cached V17 migration</button><button id="cms">Inspect CMS at 320px</button><button id="home">Inspect home at 390px</button><pre id="report">Ready</pre><div id="stage"><iframe title="Company demo inspection" id="frame" src="index.html" style="width:390px"></iframe></div><script>
const frame=document.querySelector('#frame'),report=document.querySelector('#report'),key='md_prototype_v16_content';
async function load(route,width,lang='vi'){frame.style.width=width+'px';await new Promise(r=>{frame.onload=r;frame.src=route+(route.includes('?')?'&':'?')+'lang='+lang;});const d=frame.contentDocument;await d.fonts.ready;for(const img of d.querySelectorAll('#partners img,.partner-company-list img')){try{await img.decode()}catch{}}return d;}
const inspect=d=>({viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,heading:d.querySelector('#partners h2')?.textContent,logos:d.querySelectorAll('.partner-marquee-group:not([aria-hidden]) img').length,broken:[...d.querySelectorAll('#partners img,.partner-company-list img')].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.getAttribute('src')),stretched:[...d.querySelectorAll('#partners img')].filter(i=>getComputedStyle(i).objectFit!=='contain').length,industryCards:d.querySelectorAll('.md-industry-card').length});
document.querySelector('#matrix').onclick=async()=>{const backup=localStorage.getItem(key),results=[];try{localStorage.removeItem(key);for(const width of [320,390,768,1440])for(const lang of ['vi','en','zh','ko']){const d=await load('index.html',width,lang),actual=inspect(d);results.push({width,lang,actual,pass:actual.viewport+1>=actual.scrollWidth&&actual.logos===14&&!actual.broken.length&&!actual.stretched&&!actual.industryCards});report.textContent=JSON.stringify({complete:false,results},null,2);}for(const width of [320,1440]){const d=await load('cms-demo.html',width);d.querySelector('[data-admin=partners]').click();for(const img of d.querySelectorAll('.partner-company-list img'))await img.decode();const actual={viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,companyRows:d.querySelectorAll('.partner-company-row').length,logos:d.querySelectorAll('.partner-company-list img').length,editor:!!d.querySelector('[name=demoLogoVisible]')};results.push({cms:width,actual,pass:actual.viewport+1>=actual.scrollWidth&&actual.companyRows===14&&actual.logos===14&&actual.editor});}report.textContent=JSON.stringify({complete:true,results},null,2);}catch(error){report.textContent=JSON.stringify({error:error.message,results},null,2);}finally{if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup);}};
document.querySelector('#migration').onclick=async()=>{const backup=localStorage.getItem(key);try{localStorage.removeItem(key);await load('index.html',390);const old=frame.contentWindow.MD15.getData();delete old.companyDemoRevision;old.home.heroLine1='Customer heading preserved';old.jobs[0].title='Customer job preserved';old.partners.forEach(p=>{p.logo='';p.visible=false;delete p.demoLogoVisible;});localStorage.setItem(key,JSON.stringify(old));const d=await load('index.html',390),data=frame.contentWindow.MD15.getData(),actual=inspect(d);const pass=actual.logos===14&&!actual.broken.length&&data.home.heroLine1===old.home.heroLine1&&data.jobs[0].title===old.jobs[0].title&&data.partners.every(p=>!p.approved)&&JSON.parse(localStorage.getItem(key)).companyDemoRevision===1;report.textContent=JSON.stringify({complete:true,actual,preservedHome:data.home.heroLine1,preservedJob:data.jobs[0].title,pass},null,2);}finally{if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup);}};
document.querySelector('#cms').onclick=async()=>{const d=await load('cms-demo.html',320);d.querySelector('[data-admin=partners]').click();report.textContent='CMS 320px';};
document.querySelector('#home').onclick=async()=>{const d=await load('index.html',390);d.querySelector('#partners').scrollIntoView();report.textContent=JSON.stringify(inspect(d),null,2);};
</script></html>
