<!doctype html><html lang="vi"><meta charset="utf-8"><title>Company presentation acceptance V17.2</title><style>body{font:14px/1.6 system-ui;margin:20px}button{padding:12px;margin:4px}iframe{display:block;border:1px solid #ddd;height:900px}pre{white-space:pre-wrap}#stage{overflow:auto}</style><h1>V17.2 · Company presentation acceptance</h1><button id="matrix">Run company matrix</button><button id="edge">Run content and image cases</button><button id="mobile">Inspect mobile overview</button><button id="desktop">Inspect desktop overview</button><button id="cms">Inspect company CMS</button><pre id="report">Ready</pre><div id="stage"><iframe id="frame" title="Company presentation QA" style="width:390px" src="index.html"></iframe></div><script>
const f=document.querySelector('#frame'),report=document.querySelector('#report'),key='md_prototype_v16_content';
async function settle(d){await d.fonts.ready;for(const img of d.querySelectorAll('#partners img,.partner-company-list img')){try{await img.decode()}catch{}}await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
async function load(src,width,lang='vi'){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src=src+(src.includes('?')?'&':'?')+'lang='+lang;});const d=f.contentDocument;await settle(d);return d;}
function inspect(d){const section=d.querySelector('#partners'),directory=d.querySelector('.partner-directory');return{viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,section:!!section,logos:d.querySelectorAll('.partner-marquee-group:not([aria-hidden]) img').length,cards:d.querySelectorAll('.partner-directory-card').length,open:!!directory?.open,label:directory?.querySelector('summary').textContent,broken:[...d.querySelectorAll('#partners img')].filter(i=>!i.hidden&&!i.naturalWidth).map(i=>i.getAttribute('src')),fallbacks:d.querySelectorAll('#partners .partner-logo-fallback').length,largeErrorPanels:d.querySelectorAll('#partners .v14-image-unavailable').length};}
async function withBackup(fn){const old=localStorage.getItem(key);try{localStorage.removeItem(key);await fn();}catch(error){report.textContent=JSON.stringify({error:error.message},null,2);}finally{if(old===null)localStorage.removeItem(key);else localStorage.setItem(key,old);}}
document.querySelector('#matrix').onclick=()=>withBackup(async()=>{const results=[];for(const width of [320,390,768,1440])for(const lang of ['vi','en','zh','ko']){const d=await load('index.html',width,lang),directory=d.querySelector('.partner-directory'),closed=directory.open===false;directory.querySelector('summary').click();await settle(d);const actual=inspect(d);results.push({width,lang,closedByDefault:closed,actual,pass:closed&&actual.open&&actual.logos===14&&actual.cards===14&&!actual.broken.length&&actual.scrollWidth<=actual.viewport+1});report.textContent=JSON.stringify({complete:false,results},null,2);}for(const width of [320,1440]){const d=await load('cms-demo.html',width);d.querySelector('[data-admin=partners]').click();await settle(d);const actual={viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,rows:d.querySelectorAll('.partner-company-row').length,logos:d.querySelectorAll('.partner-company-logo img').length};results.push({cms:width,actual,pass:actual.scrollWidth<=actual.viewport+1&&actual.rows===14&&actual.logos===14});}report.textContent=JSON.stringify({complete:true,results},null,2);});
document.querySelector('#edge').onclick=()=>withBackup(async()=>{const results=[];await load('index.html',390);const seed=f.contentWindow.MD15.getData();for(const count of [0,1,14])for(const width of [320,1440]){const data=structuredClone(seed);data.partners=data.partners.slice(0,count);localStorage.setItem(key,JSON.stringify(data));const d=await load('index.html',width),actual=inspect(d);const controls=!!d.querySelector('[data-pause-marquee],.partner-directory');results.push({count,width,actual,controls,pass:actual.scrollWidth<=actual.viewport+1&&actual.section===(count>0)&&(!count||actual.logos===count)&&(count>1?controls:!controls)});}for(const width of [320,1440]){const data=structuredClone(seed);data.partners[0].logo='assets/partners/deliberate-missing-demo.svg';localStorage.setItem(key,JSON.stringify(data));const d=await load('index.html',width);d.querySelector('.partner-directory summary').click();await settle(d);const actual=inspect(d),name=d.querySelector('.partner-marquee-group:not([aria-hidden]) .partner-logo-fallback')?.textContent;results.push({missingLogo:width,actual,fallbackName:name,pass:actual.scrollWidth<=actual.viewport+1&&!actual.broken.length&&actual.fallbacks===3&&!actual.largeErrorPanels&&name==='Samsung'});}for(const width of [320,1440]){const data=structuredClone(seed);data.partners[0].name='Doanh nghiệp công nghệ và sản xuất thiết bị thông minh quốc tế – tên dài phục vụ kiểm tra giao diện';localStorage.setItem(key,JSON.stringify(data));const d=await load('index.html',width);d.querySelector('.partner-directory summary').click();const h=d.querySelector('.partner-directory-card h3'),actual=inspect(d);results.push({longName:width,actual,fullName:h.textContent,pass:actual.scrollWidth<=actual.viewport+1&&h.textContent===data.partners[0].name&&h.scrollHeight<=h.clientHeight+1});}report.textContent=JSON.stringify({complete:true,results},null,2);});
async function showOverview(width){const d=await load('index.html',width);d.querySelector('.partner-directory summary').click();d.querySelector('#partners').scrollIntoView({block:'start',behavior:'instant'});report.textContent=JSON.stringify(inspect(d),null,2);}
document.querySelector('#mobile').onclick=()=>showOverview(390);document.querySelector('#desktop').onclick=()=>showOverview(1440);document.querySelector('#cms').onclick=async()=>{const d=await load('cms-demo.html',390);d.querySelector('[data-admin=partners]').click();report.textContent='CMS ·390px';};
</script></html>
