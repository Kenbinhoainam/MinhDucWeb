<!doctype html><html lang="vi"><meta charset="utf-8"><title>V17 prototype QA</title><style>body{font:14px/1.7 system-ui;color:#152e45;margin:20px}button{padding:12px;margin:5px}iframe{border:0;height:900px;display:block}pre{white-space:pre-wrap}#stage{overflow:auto}#compare{display:flex;align-items:start;gap:24px}</style><h1>Prototype V17 acceptance</h1><button id="all">Run acceptance suite</button><button id="matrix">Viewport/locale matrix</button><button id="stress">Content stress</button><button id="media">Media/rights stress</button><button id="measure">Measure contrast/targets</button><button id="mobile">Mobile About</button><button id="cms">Mobile CMS</button><button id="short">Short viewport 480px</button><button id="zoom">200% text</button><button id="reflow">Reflow samples</button><label>Trang <select id="inspectRoute"><option value="ve-minh-duc.html">About</option><option value="chi-tiet-viec-lam.html?id=cn-dien-tu">Worker detail</option><option value="chi-tiet-viec-lam.html?id=ky-su-co-dien">Internal detail</option><option value="cms-demo.html">CMS</option><option value="viec-lam.html">Jobs</option><option value="lien-he.html">Contact</option><option value="index.html">Home</option></select></label><label>Rộng <select id="inspectWidth"><option>320</option><option selected>390</option><option>640</option><option>768</option><option>1440</option></select></label><label>Ngôn ngữ <select id="inspectLocale"><option>vi</option><option>en</option><option>zh</option><option>ko</option></select></label><button id="inspect">Inspect</button><pre id="report">Ready</pre><div id="stage"><iframe id="frame" title="Prototype inspection" src="ve-minh-duc.html" style="width:390px"></iframe></div><script>
document.querySelector('#short').onclick=()=>{document.querySelector('#frame').style.height='480px';};
const report=document.querySelector('#report');const results=[];const frame=document.querySelector('#frame');
function log(id,expected,actual,pass){results.push({id,expected,actual,pass});report.textContent=JSON.stringify({complete:false,results},null,2);}
async function loadQaFrame(route,width,locale='vi'){document.querySelector('#zoom').disabled=true;frame.style.width=width+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src=route+(route.includes('?')?'&':'?')+'lang='+locale;});const d=frame.contentDocument;await d.fonts.ready;await new Promise(resolve=>setTimeout(resolve,150));document.querySelector('#zoom').disabled=false;return d;}
document.querySelector('#mobile').onclick=async()=>{await loadQaFrame('ve-minh-duc.html',390);report.textContent='Mobile About ·390px';};
document.querySelector('#cms').onclick=async()=>{await loadQaFrame('cms-demo.html',390);report.textContent='Mobile CMS ·390px';};
function resizeQaText(d){const nodes=[...d.querySelectorAll('body *')].filter(el=>[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())||el.matches('input,select,textarea')),sizes=nodes.map(el=>parseFloat(getComputedStyle(el).fontSize));nodes.forEach((el,i)=>{el.style.fontSize=(sizes[i]*2)+'px';el.style.lineHeight='1.7';});return {textScale:2,viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:[...d.querySelectorAll('body *')].filter(el=>el.getClientRects().length&&el.getBoundingClientRect().right>d.documentElement.clientWidth+1).map(el=>({cls:el.className,text:el.textContent.slice(0,50)})).slice(0,12)};}
document.querySelector('#zoom').onclick=()=>{report.textContent=JSON.stringify(resizeQaText(frame.contentDocument),null,2);};
document.querySelector('#reflow').onclick=async()=>{results.length=0;for(const width of [320,640])for(const route of ['index.html','ve-minh-duc.html','lien-he.html','chi-tiet-viec-lam.html?id=cn-dien-tu','cms-demo.html','chinh-sach-du-lieu.html'])for(const locale of route==='cms-demo.html'?['vi']:['vi','en','zh','ko']){const d=await loadQaFrame(route,width,locale),actual=resizeQaText(d);log('Z'+results.length,{width,route,locale,scale:2},actual,actual.scrollWidth<=actual.viewport+1);}report.textContent=JSON.stringify({complete:true,results},null,2);};
document.querySelector('#matrix').onclick=async()=>{results.length=0;
 const routes=['index.html','ve-minh-duc.html','dich-vu.html','viec-lam.html','tuyen-dung-noi-bo.html','chi-tiet-viec-lam.html?id=cn-dien-tu','chi-tiet-viec-lam.html?id=ky-su-co-dien','tin-tuc.html','bai-viet.html?id=xu-huong-kcn','lien-he.html','chinh-sach-du-lieu.html'];
 for(const width of [320,390,768,1440])for(const locale of ['vi','en','zh','ko'])for(const route of routes){
 const d=await loadQaFrame(route,width,locale);for(const img of d.images){img.loading='eager';try{await img.decode();}catch{}}
 const broken=[...d.images].filter(i=>!i.naturalWidth).map(i=>i.getAttribute('src'));const viewport=d.documentElement.clientWidth,overflow=d.documentElement.scrollWidth>viewport+1;const aiBadges=/Ảnh minh họa bằng AI|AI-generated illustration|AI生成示意图|AI 생성 이미지/.test(d.body.innerText);const unverifiedLogo=[...d.querySelectorAll('img')].some(i=>/commons.wikimedia|Samsung|Foxconn|Luxshare/i.test(i.getAttribute('src')||''));const h1=[...d.querySelectorAll('h1')].filter(x=>x.getClientRects().length).length;const crumb=d.querySelector('.crumb');let aligned=true;if(crumb){const parts=[...crumb.querySelectorAll('li')].map(x=>x.getBoundingClientRect());aligned=Math.max(...parts.map(x=>x.y))-Math.min(...parts.map(x=>x.y))<2;}
 log('M'+results.length,{route,width,locale},{viewport,scrollWidth:d.documentElement.scrollWidth,broken,h1,crumbAligned:aligned,aiBadges,unverifiedLogo},!overflow&&!broken.length&&h1===1&&aligned&&!aiBadges&&!unverifiedLogo);
 }
 for(const width of [320,390,768,1440]){const d=await loadQaFrame('cms-demo.html',width);log('CMS'+width,{width,panelsAbsent:true},{scrollWidth:d.documentElement.scrollWidth,viewport:d.documentElement.clientWidth,panels:!!d.querySelector('.quality-gate,#v14Preflight,#v15ServerBar')},d.documentElement.scrollWidth<=d.documentElement.clientWidth+1&&!d.querySelector('.quality-gate,#v14Preflight,#v15ServerBar'));}
 report.textContent=JSON.stringify({complete:true,results},null,2);
};
document.querySelector('#stress').onclick=async()=>{results.length=0;const key='md_prototype_v16_content',backup=localStorage.getItem(key);await loadQaFrame('index.html',390);const original=frame.contentWindow.MD15.getData();
 try{for(const count of [0,1,2,5,9]){const data=structuredClone(original);data.jobs=Array.from({length:count},(_,i)=>({...structuredClone(original.jobs[i%original.jobs.length]),id:'stress-'+i,title:i===0?'Công nhân kiểm tra linh kiện và hỗ trợ vận hành dây chuyền sản xuất tại khu công nghiệp':original.jobs[i%original.jobs.length].title}));data.posts=Array.from({length:count},(_,i)=>({...structuredClone(original.posts[i%original.posts.length]),id:'post-'+i,excerpt:i===0?'':original.posts[i%original.posts.length].excerpt}));localStorage.setItem(key,JSON.stringify(data));
 for(const route of ['index.html','viec-lam.html','tin-tuc.html']){const d=await loadQaFrame(route,320);log('S'+results.length,{count,route},{viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth},d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);}}
 const data=structuredClone(original);data.home.heroImg='assets/deliberate-404.webp';data.jobs[0].image='assets/deliberate-404.webp';localStorage.setItem(key,JSON.stringify(data));const d=await loadQaFrame('viec-lam.html',390);for(const img of d.images){img.loading='eager';try{await img.decode();}catch{}}await new Promise(r=>setTimeout(r,150));const fallback=d.querySelector('[data-image-failed],.md-image-fallback,.image-fallback,.v14-image-unavailable,[data-retry-image]');log('S404','visible fallback or retry',{fallback:!!fallback,markup:[...d.querySelectorAll('img')].filter(x=>x.src.includes('404')).map(x=>x.parentElement.outerHTML.slice(0,650))},!!fallback);
 }finally{if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup);}report.textContent=JSON.stringify({complete:true,results},null,2);
};
document.querySelector('#inspect').onclick=async()=>{const d=await loadQaFrame(document.querySelector('#inspectRoute').value,Number(document.querySelector('#inspectWidth').value),document.querySelector('#inspectLocale').value);report.textContent=JSON.stringify({viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:[...d.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.right>d.documentElement.clientWidth+1&&getComputedStyle(el).position!=='fixed';}).map(el=>({tag:el.tagName,cls:el.className,width:el.getBoundingClientRect().width,right:el.getBoundingClientRect().right,text:el.textContent.slice(0,90)})).slice(0,15)},null,2);};
document.querySelector('#media').onclick=async()=>{results.length=0;const key='md_prototype_v16_content',backup=localStorage.getItem(key);await loadQaFrame('index.html',390);const original=frame.contentWindow.MD15.getData();try{
for(const [w,h] of [[1800,600],[600,1800]]){const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#aac3cf';ctx.fillRect(0,0,w,h);ctx.fillStyle='#152e45';ctx.fillRect(w*.4,0,w*.2,h);const data=structuredClone(original);data.home.heroImg=canvas.toDataURL('image/png');data.home.gallery[0].src=data.home.heroImg;localStorage.setItem(key,JSON.stringify(data));for(const width of [320,1440]){const d=await loadQaFrame('index.html',width);const image=d.querySelector('.md-hero-img');await image.decode();const box=image.getBoundingClientRect();log('CROP'+results.length,{naturalWidth:w,naturalHeight:h,width},{natural:[image.naturalWidth,image.naturalHeight],box:[box.width,box.height],objectFit:getComputedStyle(image).objectFit,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth+1},image.naturalWidth===w&&d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);}}
const data=structuredClone(original);data.partners.forEach(p=>{p.visible=true;p.approved=true;p.logo='https://example.invalid/unlicensed-logo.png';p.permissionDocument='Checkbox is not permission';});localStorage.setItem(key,JSON.stringify(data));for(const lang of ['vi','en','zh','ko']){const d=await loadQaFrame('index.html',390,lang);const blocked=!d.querySelector('img[src*="unlicensed-logo"]');log('RIGHTS'+lang,'unverified logos remain hidden',{blocked,industryCards:d.querySelectorAll('.md-industry-card').length},blocked&&d.querySelectorAll('.md-industry-card').length===4);}
}finally{if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup);}report.textContent=JSON.stringify({complete:true,results},null,2);};
document.querySelector('#measure').onclick=async()=>{results.length=0;const d=await loadQaFrame('index.html',390);const rgb=s=>(s.match(/[\d.]+/g)||[]).slice(0,3).map(Number);const lum=a=>{const c=a.map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4});return c[0]*.2126+c[1]*.7152+c[2]*.0722};for(const selector of ['.md-visual-caption','.md-save','.md-industry-card p','[data-motion-toggle]']){const el=d.querySelector(selector),style=getComputedStyle(el);let host=el,bg=style.backgroundColor;while((bg==='rgba(0, 0, 0, 0)'||bg==='transparent')&&host.parentElement){host=host.parentElement;bg=getComputedStyle(host).backgroundColor;}const l1=lum(rgb(style.color)),l2=lum(rgb(bg)),ratio=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);const box=el.getBoundingClientRect();log(selector,'contrast >=4.5; targets >=44px where interactive',{color:style.color,background:bg,ratio,width:box.width,height:box.height},ratio>=4.5&&(!el.matches('button')||box.height>=44));}report.textContent=JSON.stringify({complete:true,results},null,2);};
document.querySelector('#all').onclick=async()=>{const suite=[];for(const id of ['matrix','reflow','stress','media','measure']){await document.getElementById(id).onclick();suite.push({suite:id,...JSON.parse(report.textContent)});}report.textContent=JSON.stringify({complete:true,total:suite.reduce((n,x)=>n+x.results.length,0),suite},null,2);};</script></html>
