<!doctype html><html lang="en"><meta charset="utf-8"><title>V25 feature verification</title>
<style>body{font:15px/1.6 system-ui;color:#102b50;margin:24px}button{padding:12px}pre{white-space:pre-wrap}iframe{height:844px;border:1px solid #ccc;display:block}</style>
<h1>V25 feature verification</h1><button id="run">Run V25 checks</button><p id="status" role="status">Ready</p><pre id="report"></pre><iframe id="stage" title="Prototype test viewport"></iframe>
<script>
const stage=document.querySelector('#stage'),rows=[];let started;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function record(id,pass,details){rows.push({id,pass:!!pass,details});show(false);}
function show(complete){const result={version:'V25',complete,total:rows.length,passed:rows.filter(r=>r.pass).length,failed:rows.filter(r=>!r.pass).length,elapsedSeconds:Math.round((performance.now()-started)/1000),method:'Same-origin iframe DOM interactions; no real API, mic recording or external messages',results:rows};document.querySelector('#report').textContent=JSON.stringify(result,null,2);document.querySelector('#status').textContent=(complete?'Complete':'Running')+' '+result.passed+'/'+result.total+' passed';}
let navigationId=0;
async function load(route,width,lang){stage.style.width=width+'px';await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Load timeout')),12000);stage.onload=()=>{clearTimeout(timer);resolve()};const url=new URL(route,location.href);url.searchParams.set('lang',lang);url.searchParams.set('__qa',String(++navigationId));stage.src=url.href;});const d=stage.contentDocument;await d.fonts.ready;await wait(70);return d;}
function inspect(d){const visible=e=>e.getClientRects().length>0,ids=[...d.querySelectorAll('[id]')].map(e=>e.id);const fields=[...d.querySelectorAll('input:not([type=hidden]),select,textarea')].filter(visible);return {viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,duplicates:ids.filter((id,i)=>ids.indexOf(id)!==i),unnamed:fields.filter(e=>!e.labels?.length&&!e.getAttribute('aria-label')&&!e.getAttribute('aria-labelledby')).map(e=>e.id||e.name)};}
async function attempt(id,fn){try{await fn()}catch(e){record(id,false,{error:e.message})}}
async function matrix(){for(const width of [320,390,768,1440])for(const lang of ['vi','en','zh','ko'])for(const route of ['index.html','viec-lam.html','chi-tiet-viec-lam.html?id=cn-dien-tu','lien-he.html'])await attempt(`matrix ${route} ${width} ${lang}`,async()=>{const d=await load(route,width,lang),a=inspect(d);record(`matrix ${route} ${width} ${lang}`,a.scrollWidth<=a.viewport+1&&!a.duplicates.length&&!a.unnamed.length,a);});}
async function featureJourneys(){for(const width of [320,390,768,1440])for(const lang of ['vi','en','zh','ko'])await attempt(`career ${width} ${lang}`,async()=>{
 const d=await load('viec-lam.html',width,lang),w=d.defaultView,root=d.querySelector('#md-career-tools');if(!root)throw Error('Career tools missing');
 root.querySelector('[data-ct-panel="optional"]').open=true;
 const calc=root.querySelector('[data-ct-panel="calc"]');calc.open=true;
 const form=root.querySelector('#md-career-calculator');form.requestSubmit();await wait(30);
 const output=root.querySelector('#md-career-calculation'),a=inspect(d);
 record(`salary default ${width} ${lang}`,output.textContent.replace(/\D/g,'').includes('7365385')&&a.scrollWidth<=a.viewport+1,{...a,text:output.textContent});
 const base=form.elements.base;base.value='-1';base.dispatchEvent(new w.Event('input',{bubbles:true}));form.requestSubmit();await wait(20);
 record(`salary validation ${width} ${lang}`,base.getAttribute('aria-invalid')==='true'&&!output.querySelector('.ct-total'),{invalid:base.getAttribute('aria-invalid')});
 form.reset();await wait(20);record(`salary reset ${width} ${lang}`,base.value==='6000000'&&!base.hasAttribute('aria-invalid'),{value:base.value});
 root.querySelector('[data-ct-panel="match"]').open=true;const match=root.querySelector('#md-career-matching'),park=match.elements.park;park.value=park.options[1].value;park.dispatchEvent(new w.Event('change',{bubbles:true}));match.requestSubmit();await wait(30);
 const cards=[...root.querySelectorAll('.ct-match')],href=cards[0]?.querySelector('a').href;
 record(`matching results ${width} ${lang}`,cards.length>0&&new URL(href).searchParams.get('lang')===lang,{count:cards.length,href});
 const toolWidths=[...root.querySelectorAll('.ct-tool')].map(e=>e.getBoundingClientRect().width),full=root.querySelector('.ct-panels').getBoundingClientRect().width;record(`matching next step ${width} ${lang}`,d.activeElement===root.querySelector('#md-career-matches')&&!!root.querySelector('.ct-match-next a[href="#resultHeading"]')&&(width<1100||toolWidths.every(n=>n>=full-2)),{focus:d.activeElement.id,toolWidths,full});
 match.elements.salary.value='999';match.elements.salary.dispatchEvent(new w.Event('input',{bubbles:true}));match.requestSubmit();await wait(20);
 record(`matching empty ${width} ${lang}`,!!root.querySelector('.ct-empty')&&!root.querySelector('.ct-match'),{});
 const expanded=inspect(d);record(`career expanded layout ${width} ${lang}`,expanded.scrollWidth<=expanded.viewport+1&&!expanded.duplicates.length&&!expanded.unnamed.length,expanded);
 });}
async function assistantJourneys(){for(const width of [320,390,1440])for(const lang of ['vi','en','zh','ko'])await attempt(`assistant ${width} ${lang}`,async()=>{
 const d=await load('chi-tiet-viec-lam.html?id=cn-dien-tu',width,lang),w=d.defaultView;const storageBefore=JSON.stringify({...localStorage});
 const opener=d.querySelector('.md-ai-inline');opener.click();await wait(30);let dialog=d.querySelector('#md-ai-dialog');
 dialog.querySelector('.md-ai-actions .is-primary').click();await wait(10);
 record(`voice invalid ${width} ${lang}`,dialog.querySelector('#md-ai-answer')?.getAttribute('aria-invalid')==='true',{});
 for(let i=0;i<5;i++){dialog.querySelector('.md-ai-voice-controls button:last-child').click();dialog.querySelector('.md-ai-actions .is-primary').click();await wait(10);}
 record(`voice review ${width} ${lang}`,dialog.querySelectorAll('.md-ai-review dd').length===5&&!d.querySelector('#applyForm [name=name]').value,{rows:dialog.querySelectorAll('.md-ai-review dd').length});
 dialog.querySelector('.md-ai-content > .is-primary').click();await wait(20);const form=d.querySelector('#applyForm');
 record(`voice confirmed fill ${width} ${lang}`,!d.querySelector('#md-ai-dialog')&&!!form.querySelector('[name=name]').value&&!!form.querySelector('.md-ai-fill-status')&&!form.querySelector('[name=consent]')?.checked,{name:form.querySelector('[name=name]').value});
 record(`voice no storage ${width} ${lang}`,storageBefore===JSON.stringify({...localStorage}),{});
 opener.click();await wait(10);dialog=d.querySelector('#md-ai-dialog');dialog.querySelector('[data-ai-view=chat]').click();await wait(10);dialog.querySelector('.md-ai-prompts button').click();await wait(10);
 const links=[...dialog.querySelectorAll('.md-ai-log a')];const rect=dialog.getBoundingClientRect();
 record(`chat links/layout ${width} ${lang}`,links.length>0&&links.every(a=>new URL(a.href).searchParams.get('lang')===lang)&&rect.left>=0&&rect.right<=d.documentElement.clientWidth+1,{links:links.map(a=>a.href),rect:{left:rect.left,right:rect.right}});
 dialog.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(10);record(`assistant escape ${width} ${lang}`,!d.querySelector('#md-ai-dialog')&&d.activeElement===opener,{});
 });}
async function operationsJourneys(){const key='md_ops_v24',before=localStorage.getItem(key);try{for(const width of [320,390,768,1440])await attempt(`operations ${width}`,async()=>{
 localStorage.removeItem(key);const d=await load('cms-demo.html#ops-candidates',width,'vi');
 const chooser=d.querySelector('#ops-section'),mobile=width<=900;record(`operations section chooser ${width}`,!!chooser&&(mobile?chooser.getClientRects().length>0&&d.querySelector('[data-ops-heading]').getBoundingClientRect().top<420:!chooser.getClientRects().length),{headingTop:d.querySelector('[data-ops-heading]').getBoundingClientRect().top});
 const click=sel=>{const el=d.querySelector(sel);if(!el)throw Error('Missing '+sel);el.click();};
 click('[data-ops-action=detail][data-id="C-001"]');let f=d.querySelector('[data-ops-form=record]');f.elements.status.value='screening';f.requestSubmit();await wait(20);
 record(`candidate saves ${width}`,d.querySelector('.ops-detail .ops-screening')&&JSON.parse(localStorage.getItem(key)).outbox.length===4,{});
 click('[data-ops-tab=notifications]');click('[data-ops-action=attempt][data-id="N-001"]');await wait(10);record(`notification failure ${width}`,!!d.querySelector('.ops-failed'),{});
 f=d.querySelector('[data-ops-form=config][data-channel=zalo]');f.elements.outcome.value='success';f.requestSubmit();await wait(10);click('[data-ops-action=attempt][data-id="N-001"]');await wait(10);record(`notification retry ${width}`,!!d.querySelector('.ops-simulated'),{});
 click('[data-ops-tab=leads]');click('[data-ops-action=detail][data-id="L-001"]');f=d.querySelector('[data-ops-form=record]');f.elements.status.value='qualified';f.elements.headcount.value='150';f.requestSubmit();await wait(10);record(`FDI pipeline ${width}`,!!d.querySelector('.ops-qualified')&&d.querySelector('[name=headcount]').value==='150',{});
 click('[data-ops-tab=parks]');click('[data-ops-action=new-park]');d.querySelector('[data-ops-form=park-create]').requestSubmit();await wait(10);record(`KCN creates ${width}`,!!d.querySelector('[data-ops-detail-heading]'),{});
 click('[data-ops-tab=training]');click('[data-ops-action=training-complete]');await wait(10);record(`training ${width}`,d.querySelector('[data-ops-action=training-step]').textContent.includes('✓'),{});
 const a=inspect(d);record(`operations layout ${width}`,a.scrollWidth<=a.viewport+1&&!a.duplicates.length&&!a.unnamed.length,a);
 });}finally{if(before===null)localStorage.removeItem(key);else localStorage.setItem(key,before);}}
document.querySelector('#run').onclick=async()=>{const b=document.querySelector('#run');b.disabled=true;rows.length=0;started=performance.now();try{await matrix();await featureJourneys();await assistantJourneys();await operationsJourneys();}catch(e){record('harness',false,{error:e.message})}finally{stage.src='about:blank';show(true);b.disabled=false}};
</script></html>
