<!doctype html><html lang="en"><meta charset="utf-8"><title>V27 personalization checks</title><style>body{font:15px/1.6 system-ui;margin:20px;color:#102b50}button{padding:12px}pre{white-space:pre-wrap}iframe{display:block;height:844px;border:1px solid #bbb}</style>
<h1>V27 personalization checks</h1><button id="run">Run V27 checks</button><button id="axe">Run V27 accessibility</button><p id="status" role="status">Ready</p><pre id="report"></pre><iframe id="frame" title="V27 viewport"></iframe>
<script>
const frame=document.querySelector('#frame'),rows=[];let serial=0,start;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),q=(d,s)=>d.querySelector(s),visible=e=>!!e?.getClientRects().length;
function show(complete){const r={version:'V27',complete,total:rows.length,passed:rows.filter(x=>x.pass).length,failed:rows.filter(x=>!x.pass).length,elapsedSeconds:Math.round((performance.now()-start)/1000),method:'same-origin iframe UI actions and DOM assertions; keyboard checked separately',results:rows};q(document,'#report').textContent=JSON.stringify(r,null,2);q(document,'#status').textContent=(complete?'Complete':'Running')+' '+r.passed+'/'+r.total+' passed'}
function check(id,pass,details={}){rows.push({id,pass:!!pass,details});show(false)}
async function attempt(id,fn){try{await fn()}catch(e){check(id,false,{error:e.message})}}
async function load(route,width,lang='vi'){frame.style.width=width+'px';await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Load timeout')),15000);frame.onload=()=>{clearTimeout(timer);resolve()};const u=new URL(route,location.href);u.searchParams.set('lang',lang);u.searchParams.set('__qa',++serial);frame.src=u.href});const d=frame.contentDocument;await d.fonts.ready;await wait(60);return d}
function change(d,el,value){el.value=value;el.dispatchEvent(new d.defaultView.Event('input',{bubbles:true}));el.dispatchEvent(new d.defaultView.Event('change',{bubbles:true}))}
function inspect(d){const ids=[...d.querySelectorAll('[id]')].map(e=>e.id),fields=[...d.querySelectorAll('input:not([type=hidden]),select,textarea')].filter(visible);return{width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,h1:[...d.querySelectorAll('h1')].filter(visible).length,duplicates:ids.filter((x,i)=>ids.indexOf(x)!==i),unnamed:fields.filter(e=>!e.labels?.length&&!e.getAttribute('aria-label')&&!e.getAttribute('aria-labelledby')).map(e=>e.id||e.name)}}
async function matrix(){for(const width of [320,390,768,1440])for(const lang of ['vi','en','zh','ko'])for(const route of ['index.html','ve-minh-duc.html','lien-he.html'])await attempt(`layout ${route} ${width} ${lang}`,async()=>{const d=await load(route,width,lang),s=inspect(d);check(`layout ${route} ${width} ${lang}`,s.scroll<=s.width+1&&s.h1===1&&!s.duplicates.length&&!s.unnamed.length&&d.body.textContent.includes('CÔNG TY TNHH NHÂN LỰC MINH ĐỨC VINA')&&!d.body.textContent.includes('vieclamminhduc.vpv2@gmail.com'),s)})}
async function branches(){for(const width of [390,1440])for(const lang of ['vi','en','zh','ko'])await attempt(`branch flow ${width} ${lang}`,async()=>{
 const d=await load('lien-he.html',width,lang),scope=q(d,'[data-md-company-scope=contact]'),form=q(d,'#contactForm');
 check(`initial data and no map request ${width} ${lang}`,scope.querySelectorAll('[data-md-branches-select]').length===3&&!scope.querySelector('iframe')&&!!scope.querySelector('a[href="tel:0364562868"]')&&!!scope.querySelector('a[href="https://zalo.me/0329138082"]')&&!!scope.querySelector('a[href="https://www.facebook.com/md668.com.vn"]'));
 check(`Voi original destination ${width} ${lang}`,!!scope.querySelector('a[href="https://maps.app.goo.gl/2hj5gqjuaLS4t6hk8"]'));
 q(d,'[data-md-branches-load=voi]').click();await wait(40);let map=scope.querySelector('iframe');check(`Voi deliberate map ${width} ${lang}`,map?.src.includes('0xdf7f9c998ab7ef61')&&map.title.includes('Vôi'));
 change(d,form.elements.message,'Demo V27 contact message');change(d,form.elements.company,'Demo V27 Company');
 q(d,'[data-md-branches-select=bac-ninh]').click();check(`Bac Ninh switch unloads previous map ${width} ${lang}`,!scope.querySelector('iframe')&&!!scope.querySelector('a[href="https://maps.app.goo.gl/VjV1DbkajBXDqGUE7?g_st=iz"]'));
 q(d,'[data-md-branches-load=bac-ninh]').click();await wait(40);map=scope.querySelector('iframe');check(`Bac Ninh map and preserved form ${width} ${lang}`,map?.src.includes('0x940bfed5d4736488')&&map.title.includes('Bắc Ninh')&&form.elements.message.value==='Demo V27 contact message'&&form.elements.company.value==='Demo V27 Company');
 q(d,'[data-md-branches-select=quang-ninh]').click();check(`Quang Ninh honest empty map ${width} ${lang}`,!scope.querySelector('iframe')&&!q(d,'[data-md-branches-load]')&&!scope.querySelector('a[href*="maps.app.goo.gl"]')&&!!q(d,'[data-md-branches-status][aria-live=polite]'));
 q(d,'#contactNext').click();change(d,form.elements.name,'Demo V27 QA');change(d,form.elements.phone,'0900000000');change(d,q(d,'#languageSelect'),lang==='en'?'ko':'en');await wait(90);
 const fresh=q(d,'#contactForm');check(`locale preserves form and clears map ${width} ${lang}`,fresh.elements.message.value==='Demo V27 contact message'&&fresh.elements.name.value==='Demo V27 QA'&&fresh.elements.phone.value==='0900000000'&&!fresh.elements.consent.checked&&!q(d,'[data-md-company-scope] iframe'));
})}
async function briefOrder(){for(const width of [390,1440])for(const lang of ['vi','en','zh','ko'])await attempt(`intent ${width} ${lang}`,async()=>{for(const route of ['lien-he.html?wb=1&wb_n=180','lien-he.html?service=supply']){const d=await load(route,width,lang);check(`brief before branches ${route} ${width} ${lang}`,!!(q(d,'#contactForm').compareDocumentPosition(q(d,'#chi-nhanh'))&4))}})}
async function cms(){for(const width of [390,1440])await attempt(`CMS ${width}`,async()=>{
 let d=await load('cms-demo.html',width);q(d,'[data-admin=company]').click();await wait(30);let f=q(d,'[data-company-form]');check(`CMS defaults ${width}`,f.querySelectorAll('[data-company-branch]').length===3&&f.elements.legalName.value==='CÔNG TY TNHH NHÂN LỰC MINH ĐỨC VINA');
 change(d,f.elements['branch.0.mapsUrl'],'https://evil.test/map');f.requestSubmit();await wait(30);check(`CMS unsafe map rejected ${width}`,d.defaultView.MD15.getData().branches[0].mapsUrl==='https://maps.app.goo.gl/2hj5gqjuaLS4t6hk8'&&q(d,'[data-company-status]').textContent.length>0);
 change(d,f.elements['branch.0.mapsUrl'],'https://maps.app.goo.gl/2hj5gqjuaLS4t6hk8');change(d,f.elements['branch.0.name'],'Chi nhánh Vôi QA');change(d,f.elements['branch.0.address'],'Địa chỉ thử nghiệm V27');f.querySelectorAll('[data-company-branch]')[1].querySelector('[data-company-action=up]').click();
 f.requestSubmit();await wait(80);let saved=d.defaultView.MD15.getData();check(`CMS reordered save and JSON roundtrip ${width}`,saved.branches[0].id==='bac-ninh'&&saved.branches[1].name==='Chi nhánh Vôi QA'&&d.defaultView.MDCompanyProfile.valid(JSON.parse(JSON.stringify(saved))));
 d=await load('lien-he.html',width);check(`CMS changes appear publicly ${width}`,q(d,'[data-md-branches-select="voi"]').textContent.includes('Chi nhánh Vôi QA')&&q(d,'[data-md-branches-select="bac-ninh"]').getAttribute('aria-pressed')==='true');
 d=await load('cms-demo.html',width);q(d,'[data-admin=company]').click();await wait(20);f=q(d,'[data-company-form]');while(f.querySelector('[data-company-action=remove]'))f.querySelector('[data-company-action=remove]').click();f.requestSubmit();await wait(60);check(`CMS deliberate empty save ${width}`,d.defaultView.MD15.getData().branches.length===0);
 d=await load('lien-he.html',width);check(`Empty branches do not resurrect ${width}`,!q(d,'[data-md-branches-select]')&&!q(d,'[data-md-branches-load]')&&!!q(d,'a[href="tel:0364562868"]'));
 d=await load('cms-demo.html',width);q(d,'[data-admin=settings]').click();await wait(20);let confirms=0;d.defaultView.confirm=()=>{confirms++;return true};
 const before=d.defaultView.MD15.getData(),broken=JSON.parse(JSON.stringify(before));delete broken.partners;const input=q(d,'[data-import]'),transfer=new d.defaultView.DataTransfer();transfer.items.add(new d.defaultView.File([JSON.stringify(broken)],'broken-v27.json',{type:'application/json'}));input.files=transfer.files;input.dispatchEvent(new d.defaultView.Event('change',{bubbles:true}));await wait(80);
 check(`CMS incomplete V27 import rejected ${width}`,confirms===0&&d.defaultView.MD15.getData().partners.length===before.partners.length);
 const old=JSON.parse(JSON.stringify(before));delete old.companyProfileRevision;delete old.company;delete old.branches;delete old.partners;const oldTransfer=new d.defaultView.DataTransfer();oldTransfer.items.add(new d.defaultView.File([JSON.stringify(old)],'legacy.json',{type:'application/json'}));input.files=oldTransfer.files;input.dispatchEvent(new d.defaultView.Event('change',{bubbles:true}));await wait(80);
 check(`CMS old import seeds safely ${width}`,confirms===1&&d.defaultView.MD15.getData().branches.length===3&&d.defaultView.MD15.getData().partners.length===5);
 q(d,'[data-admin=settings]').click();await wait(20);const social=q(d,'#socialSettingsForm');for(const key of ['hotline','zalo','messenger'])change(d,social.elements[key],'');social.requestSubmit();await wait(60);
 d=await load('lien-he.html',width);q(d,'[data-social-toggle]').click();await wait(20);check(`Facebook-only widget remains useful ${width}`,!!q(d,'.md-social a[href="https://www.facebook.com/md668.com.vn"]')&&!q(d,'.md-social-note'));
 // Restore the baseline before the next independent viewport case.
 localStorage.removeItem('md_prototype_v16_content');
})}
async function axe(){for(const width of [390,1440])for(const lang of ['vi','en','zh','ko'])for(const route of ['index.html','ve-minh-duc.html','lien-he.html'])await attempt(`axe ${route} ${width} ${lang}`,async()=>{const d=await load(route,width,lang);await new Promise((resolve,reject)=>{const s=d.createElement('script');s.src='/__axe.js';s.onload=resolve;s.onerror=reject;d.head.append(s)});const a=await d.defaultView.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']}});check(`axe ${route} ${width} ${lang}`,a.violations.length===0,{violations:a.violations.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)})),incomplete:a.incomplete.map(x=>({id:x.id,nodes:x.nodes.length}))})})}
async function run(mode){const before=localStorage.getItem('md_prototype_v16_content');localStorage.removeItem('md_prototype_v16_content');rows.length=0;start=performance.now();q(document,'#run').disabled=q(document,'#axe').disabled=true;try{if(mode==='axe')await axe();else{await matrix();await branches();await briefOrder();await cms()}}finally{if(before===null)localStorage.removeItem('md_prototype_v16_content');else localStorage.setItem('md_prototype_v16_content',before);frame.src='about:blank';show(true);q(document,'#run').disabled=q(document,'#axe').disabled=false}}
q(document,'#run').onclick=()=>run('all');q(document,'#axe').onclick=()=>run('axe');
</script></html>
