<!doctype html><html lang="vi"><meta charset="utf-8"><title>Minh Đức — Visual QA</title><style>body{font:14px Arial;background:#edf1f4;color:#17354a;margin:0}header{display:flex;gap:16px;padding:16px;position:sticky;top:0;background:white;z-index:10;flex-wrap:wrap}button,select{padding:12px;font:inherit}main{padding:20px;overflow:auto}iframe{background:white;border:1px solid #a6bbc9;display:block;height:800px;margin:0 auto}table{border-collapse:collapse;font-size:12px;background:white}td,th{padding:8px;border:1px solid #ccc}pre{white-space:pre-wrap}#results{margin-top:25px}</style><header><strong>Minh Đức · QA</strong><label>Width <select id="size"><option>390</option><option>320</option><option>768</option><option>1440</option><option>2560</option></select></label><label>Page <select id="page"><option value="index.html">Home</option><option value="viec-lam.html">Jobs</option><option value="chi-tiet-viec-lam.html?id=cn-dien-tu">Worker application</option><option value="chi-tiet-viec-lam.html?id=ky-su-co-dien">Internal application</option><option value="tuyen-dung-noi-bo.html">Internal</option><option value="dich-vu.html">Services</option><option value="ve-minh-duc.html">About</option><option value="tin-tuc.html">News</option><option value="bai-viet.html?id=xu-huong-kcn">Article</option><option value="lien-he.html">Contact</option><option value="quan-tri.html">CMS</option></select></label><label>Lang <select id="lang"><option>vi</option><option>en</option><option>zh</option><option>ko</option></select></label><button id="matrix">Run responsive matrix</button><button id="stress">Stress test text + images</button><span id="status">Ready</span></header><main><iframe id="preview" title="Responsive preview" style="width:390px" src="index.html?lang=vi"></iframe><div id="results"></div></main><script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size'),page=document.querySelector('#page'),lang=document.querySelector('#lang');
function url(p,l){return p+(p.includes('?')?'&':'?')+'lang='+l+'&preview=1';}
function show(){frame.style.width=size.value+'px';frame.src=url(page.value,lang.value);}
for(const input of [size,page,lang])input.addEventListener('change',show);
function load(p,l,w){return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve();};frame.onload=()=>{const doc=frame.contentDocument;if(!doc?.documentElement)return;Promise.race([doc.fonts.ready,new Promise(r=>setTimeout(r,1800))]).then(()=>setTimeout(finish,80));};frame.style.width=w+'px';frame.src=url(p,l);setTimeout(finish,8000);});}
function measure(p,l,w){const d=frame.contentDocument;if(!d?.documentElement)return {page:p,lang:l,width:w,loadError:true};const visible=e=>{const s=frame.contentWindow.getComputedStyle(e);return e.getClientRects().length&&s.visibility!=='hidden'&&s.display!=='none'&&!e.closest('[hidden],[aria-hidden=true]');};const over=[...d.querySelectorAll('main *,header *,footer *')].filter(e=>visible(e)&&e.getBoundingClientRect().right>w+1&&!e.closest('.partner-marquee')).slice(0,8).map(e=>e.tagName+'.'+e.className);const broken=[...d.images].filter(e=>visible(e)&&e.complete&&!e.naturalWidth).map(e=>e.getAttribute('src'));const h1=[...d.querySelectorAll('h1')].filter(visible).length;const clipped=[...d.querySelectorAll('h1,h2,h3,.btn,.sortbtn,button')].filter(e=>visible(e)&&e.scrollWidth>e.clientWidth+3&&e.clientWidth>0).slice(0,8).map(e=>e.textContent.slice(0,70));return {page:p,lang:l,width:w,overflow:Math.max(0,d.documentElement.scrollWidth-w),h1,broken,over,clipped};}
document.querySelector('#matrix').onclick=async()=>{
 const rows=[],tasks=[];const pages=[...page.options].map(o=>o.value);for(const p of pages)for(const l of p==='quan-tri.html'?['vi']:['vi','en','zh','ko'])for(const w of p==='index.html'?[320,390,768,1440,2560]:[320,390,768,1440])tasks.push([p,l,w]);
 document.querySelector('#matrix').disabled=true;document.querySelector('#results').innerHTML='<pre id="jsonResults"></pre>';let cursor=0;
 const work=async()=>{const f=document.createElement('iframe');f.style.cssText='position:fixed;left:-20000px;top:0;height:900px';document.body.append(f);while(cursor<tasks.length){const [p,l,w]=tasks[cursor++];await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve();};f.onload=()=>{const d=f.contentDocument;if(!d?.documentElement)return;Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(()=>setTimeout(finish,100));};f.style.width=w+'px';f.src=url(p,l);setTimeout(finish,6000);});
 let result;try{const d=f.contentDocument;const visible=e=>{const st=f.contentWindow.getComputedStyle(e);return e.getClientRects().length&&st.display!=='none'&&st.visibility!=='hidden'&&!e.closest('[hidden],[aria-hidden=true]');};result={page:p,lang:l,width:w,overflow:Math.max(0,d.documentElement.scrollWidth-w),h1:[...d.querySelectorAll('h1')].filter(visible).length,broken:[...d.images].filter(e=>visible(e)&&e.complete&&!e.naturalWidth).map(e=>e.getAttribute('src')),clipped:[...d.querySelectorAll('h1,h2,h3,.btn,.sortbtn,button')].filter(e=>visible(e)&&e.scrollWidth>e.clientWidth+3&&e.clientWidth>0).map(e=>e.textContent.slice(0,70))};}catch(e){result={page:p,lang:l,width:w,loadError:String(e)}}rows.push(result);document.querySelector('#status').textContent='Checked '+rows.length+'/'+tasks.length;document.querySelector('#jsonResults').textContent=JSON.stringify(rows,null,2);
 }f.remove();};await Promise.all([work(),work(),work(),work()]);document.querySelector('#status').textContent='Complete: '+rows.length+' cases, '+rows.filter(r=>r.loadError||r.overflow||r.h1!==1||r.broken?.length||r.clipped?.length).length+' issues';document.querySelector('#matrix').disabled=false;
};
document.querySelector('#stress').onclick=()=>{const d=frame.contentDocument;d.querySelectorAll('main h1,main h2,main h3,main .btn').forEach(e=>e.textContent=(e.innerText+' '+e.innerText));const first=d.querySelector('.md-hero-img,.gallery-item img');if(first){first.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMjAiIGhlaWdodD0iOTYwIj48cmVjdCB3aWR0aD0iMzIwIiBoZWlnaHQ9Ijk2MCIgZmlsbD0id2hpdGUiLz48Y2lyY2xlIGN4PSIxNjAiIGN5PSIxMjAiIHI9IjkwIiBmaWxsPSIjY2NjIi8+PC9zdmc+';first.style.objectPosition='0% 0%';}const r=measure(page.value,lang.value,Number(size.value));document.querySelector('#results').innerHTML='<pre id="stressResults"></pre>';document.querySelector('#stressResults').textContent=JSON.stringify(r,null,2);document.querySelector('#status').textContent='200% text stress completed';};
</script></html>
